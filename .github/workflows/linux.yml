name: Linux no-game checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Check shell syntax
        run: sh -n install.sh play.sh
      - name: Validate adapter and upstream JSON
        run: python -m json.tool upstream.lock.json > /dev/null && python -m json.tool adapters/tomodachi/target.json > /dev/null
      - name: Run synthetic tests (no game, keys or firmware)
        run: python -m unittest discover -s tests -v
