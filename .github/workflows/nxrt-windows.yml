# Does the nxrt runtime (without any game) compile on Windows? Builds only nxrt_core with a stub game export: no game file, key or
# firmware is ever used here, and nothing is run. It proves the code compiles and links on Windows; it does not prove the game runs.
name: nxrt Windows compile check

on:
  push:
    branches: [main]
    paths: ['runtime/**', '.github/workflows/nxrt-windows.yml']
  pull_request:
    branches: [main]
    paths: ['runtime/**', '.github/workflows/nxrt-windows.yml']
  workflow_dispatch:

jobs:
  nxrt-core:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (fmt, SDL2, Vulkan loader from vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install fmt sdl2 vulkan vulkan-loader --triplet x64-windows
      - name: Boost headers
        shell: pwsh
        run: |
          curl.exe -L --fail -o boost.zip https://archives.boost.io/release/1.84.0/source/boost_1_84_0.zip
          Expand-Archive boost.zip -DestinationPath "$env:RUNNER_TEMP\boost" -Force
          "BOOST_ROOT_DIR=$env:RUNNER_TEMP\boost\boost_1_84_0" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Stub game export
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\stub\exefs" | Out-Null
          # Stand-ins for what the recompiled game provides, only so that nxrt.exe links; there is no game code behind them.
          $stub = @'
          /* stub: no game export */
          const void* suyu_recomp_static_modules_v4(unsigned* count) { if (count) *count = 0; return 0; }
          int suyu_recomp_static_guard_v2(unsigned v) { (void)v; return 0; }
          unsigned suyu_recomp_static_guard_gen_v1(unsigned a, void* b, unsigned c) { (void)a; (void)b; (void)c; return 0; }
          int suyu_recomp_static_fastmem_v1(void) { return 0; }
          int suyu_recomp_static_fpx_v1(void) { return 0; }
          int suyu_recomp_static_features_v1(void) { return 0; }
          '@
          Set-Content -LiteralPath "$env:RUNNER_TEMP\stub\exefs\recomp_registration.c" -Value $stub
      - name: Configure
        shell: pwsh
        run: |
          cmake -S runtime -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows `
            "-DNXRT_GAME_EXPORT=$env:RUNNER_TEMP\stub\exefs" "-DNXRT_GAME_LIBS=kernel32" "-DNXRT_BOOST_ROOT=$env:BOOST_ROOT_DIR"
      - name: Build nxrt_core and link nxrt.exe (with the stand-ins)
        shell: pwsh
        run: cmake --build build --target nxrt -j 4 -- -k 0 2>&1 | Tee-Object -FilePath build-log.txt
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxrt-windows-build-log
          path: build-log.txt
