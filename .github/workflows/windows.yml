# Checks the Windows installer path that needs no game: tools, download, patches and the suyu build (steps 1, 3, 4, 5).
# No game file, key or firmware is ever used here.
name: Windows build check

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'patches/**', 'upstream.lock.json', 'install.bat', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  script-check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          exit $bad

  build-tools:
    needs: script-check
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer, CI mode (no game)
        shell: pwsh
        run: ./scripts/windows/install.ps1 -CI
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: |
            local/logs/
            artifacts/*.log
          if-no-files-found: ignore
